<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Valentine Card</title>
<style>
    html, body {
        height: 100%;
        margin: 0;
        font-family: Arial, sans-serif;
    }
    body {
        display: flex;
        justify-content: center;
        align-items: center;
        background: url('minion-minion-loves.gif') no-repeat center center;
        background-size: cover;
        flex-direction: column;
        text-align: center;
        color: white;
    }
    h1 {
        font-size: 3em;
        text-shadow: 2px 2px 4px #000;
        margin-bottom: 40px;
    }
    .buttons {
        display: flex;
        gap: 20px;
    }
    button {
        padding: 15px 30px;
        font-size: 1.5em;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        transition: all 0.3s ease;
    }
    #yes {
        background-color: #ff69b4;
        color: white;
    }
    #no {
        background-color: #fff;
        color: #ff69b4;
    }
</style>
</head>
<body>
    <h1>Would u be my Valentine?</h1>
    <div class="buttons">
        <button id="yes">Yes</button>
        <button id="no">No</button>
    </div>

<script>
    const yesBtn = document.getElementById('yes');
    const noBtn = document.getElementById('no');

    noBtn.addEventListener('click', () => {
        let currentWidth = yesBtn.offsetWidth;
        yesBtn.style.width = (currentWidth + 20) + 'px';
        yesBtn.style.fontSize = (parseInt(window.getComputedStyle(yesBtn).fontSize) + 2) + 'px';
    });
</script>
</body>
</html>

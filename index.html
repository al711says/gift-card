<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Valentine Card</title>
<style>
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: #fff0f5;
    font-family: Arial, sans-serif;
    flex-direction: column;
  }

  .card {
    text-align: center;
    padding: 20px;
    border-radius: 15px;
    background: #ffe4e1;
    box-shadow: 0 8px 16px rgba(0,0,0,0.2);
  }

  .card img {
    width: 466px;
    height: 498px;
    border-radius: 10px;
    transition: all 0.3s ease;
  }

  .message {
    font-size: 24px;
    margin: 15px 0;
    color: #d1477c;
  }

  .buttons {
    display: flex;
    justify-content: center;
    gap: 20px;
  }

  .btn {
    padding: 12px 30px;
    font-size: 20px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.3s ease;
  }

  .btn-yes {
    background-color: #ff69b4;
    color: white;
    animation: bounce 1s infinite alternate;
  }

  .btn-no {
    background-color: #ccc;
  }

  .btn-yes:hover {
    transform: scale(1.2);
  }

  @keyframes bounce {
    0% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
    100% { transform: translateY(0); }
  }

  .bounce-strong {
    animation: bounce-strong 0.5s infinite alternate;
  }

  @keyframes bounce-strong {
    0% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-25px) scale(1.5); }
    100% { transform: translateY(0) scale(1); }
  }
</style>
</head>
<body>
  <div class="card">
    <img id="minionGif" src="minion-minion-loves.gif" alt="Minion Love">
    <div class="message">Would u be my Valentine?</div>
    <div class="buttons">
      <button id="yesBtn" class="btn btn-yes">Yes</button>
      <button id="noBtn" class="btn btn-no">No</button>
    </div>
  </div>

  <script>
    const yesBtn = document.getElementById('yesBtn');
    const noBtn = document.getElementById('noBtn');
    const gif = document.getElementById('minionGif');

    yesBtn.addEventListener('click', () => {
      gif.src = 'love.gif';
    });

    noBtn.addEventListener('click', () => {
      yesBtn.classList.add('bounce-strong');
      // убрать эффект через 1 сек, чтобы не бесконечно дергалось
      setTimeout(() => yesBtn.classList.remove('bounce-strong'), 1000);
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Valentine Card</title>
<style>
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: #fff0f5;
    font-family: Arial, sans-serif;
    flex-direction: column;
  }

  .card {
    text-align: center;
    padding: 20px;
    border-radius: 15px;
    background: #ffe4e1;
    box-shadow: 0 8px 16px rgba(0,0,0,0.2);
  }

  .card img {
    width: 466px;
    height: 498px;
    border-radius: 10px;
  }

  .message {
    font-size: 24px;
    margin: 15px 0;
    color: #d1477c;
  }

  .buttons {
    display: flex;
    justify-content: center;
    gap: 20px;
  }

  .btn {
    padding: 12px 30px;
    font-size: 20px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.3s ease;
  }

  .btn-yes {
    background-color: #ff69b4;
    color: white;
    animation: bounce 1s infinite alternate;
  }

  .btn-yes:hover {
    transform: scale(1.2);
  }

  .btn-no {
    background-color: #ccc;
  }

  @keyframes bounce {
    0% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
    100% { transform: translateY(0); }
  }
</style>
</head>
<body>
  <div class="card">
    <img src="minion-minion-loves.gif" alt="Minion Love">
    <div class="message">Would u be my Valentine?</div>
    <div class="buttons">
      <button class="btn btn-yes">Yes</button>
      <button class="btn btn-no">No</button>
    </div>
  </div>
</body>
</html>
